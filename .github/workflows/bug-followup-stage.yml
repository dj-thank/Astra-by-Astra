name: Stage verified follow-up git objects
on:
  push:
    branches: [fix/star-bug-hardening-20260910]
    paths: [.github/workflows/bug-followup-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 309992e6e6cef8ba1eabadd778fbc11df530a2b2
          persist-credentials: false
      - name: Verify patches and stage git objects without moving any branch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, subprocess, urllib.request
          API = 'https://api.github.com/repos/dj-thank/Astra-by-Astra'
          BASE = '309992e6e6cef8ba1eabadd778fbc11df530a2b2'
          BASE_TREE = '538d5d287c798f5bc5f050887ca29f317ab0599d'
          EXPECTED_TREE = '30f21b3b5d4a262bf6ea3b13b4cf3fe0f5819304'
          PATCHES = [
              ('785bd643546a98aafc7b013f466093fbb8234ac4', '0d0e126d7300e15f603c456b0aa7bb5e12e91ebc17f12f64cb3b8d60f0aa0b6d'),
              ('11ccc9609a86255174ac2cfe73bd397d1f18170a', '1af0a37a5ca0a39d1d41ec6d7649d2ebb9bce4f43382ddf83b85721d167d56f3'),
              ('a947dd29688dbd988cfb3bc39d48ad62d30eefb7', '18791ec3b310336fe109ea90efd2b410be1baa53f7705e760e28e800819bb357'),
              ('453478d29711b2864230bba280fe32374f291ba9', 'b8b895d5e9f24b149f30434ec418926d28e0d7d8b9234addf5a4df6204b4a6ed'),
              ('03cf0988426110a34b364035b561235434ade869', 'b66c82324047de4f8a1167533f132f525bbbb2de4ddef40f58886bfe925089d0'),
          ]
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(API + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == BASE
          assert git('write-tree').decode().strip() == BASE_TREE
          patch = b''
          for blob_sha, digest in PATCHES:
              blob = api('/git/blobs/' + blob_sha)
              assert blob['encoding'] == 'base64'
              content = base64.b64decode(blob['content'])
              assert hashlib.sha256(content).hexdigest() == digest, blob_sha
              patch += content
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert git('write-tree').decode().strip() == EXPECTED_TREE
          paths = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert len(paths) == 24
          assert '.github/workflows/bug-followup-stage.yml' not in paths
          assert not any(p.startswith(('Data/', 'Content/', 'Art/', 'Saved/', 'outputs/', 'work/')) for p in paths)
          entries = []
          for path in paths:
              content = git('show', ':' + path)
              wanted = git('rev-parse', ':' + path).decode().strip()
              created = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              assert created['sha'] == wanted, path
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': wanted})
          tree = api('/git/trees', {'base_tree': BASE_TREE, 'tree': entries})
          assert tree['sha'] == EXPECTED_TREE
          print('Verified and staged final tree:', tree['sha'])
          print('Changed files:', len(entries))
          print('No commits, branch updates, merges or releases were performed by this workflow.')
