name: Native tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Flight simulation
        shell: pwsh
        run: ./Tools/Simulation/Test-Native.ps1
      - name: Malformed data and raster safety regressions
        shell: pwsh
        run: ./Tools/Simulation/Test-Robustness.ps1
      - name: Audio routing
        shell: pwsh
        run: ./Tools/Audio/Test-Routing.ps1
      - name: Navigation and real controller policy
        shell: pwsh
        run: |
          ./Tools/Navigation/Test-Native.ps1
          ./Tools/Navigation/Test-Runtime.ps1
      - name: Content installation safety
        shell: pwsh
        run: python Tests/Release/test_content_setup.py
      - name: Continuous world and solar geometry
        shell: pwsh
        run: ./Tools/Simulation/Test-WorldContinuity.ps1
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: All self-contained native suites with memory and UB checks
        run: python3 Tools/Testing/run_native.py --sanitize --compiler clang++ --jobs 2
      - name: GCC compatibility for all self-contained native suites
        run: python3 Tools/Testing/run_native.py --compiler g++ --jobs 2
      - name: Install libtiff host test dependency
        run: sudo apt-get update && sudo apt-get install -y libtiff-dev pkg-config
      - name: Production TIFF decoder with real libtiff and injected read failures
        run: python3 Tools/Testing/run_raster_decode.py --sanitize --compiler clang++
